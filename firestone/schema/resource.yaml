type: object
properties:
  kind:
    description: The "kind" or type of resource
    type: string
  apiVersion:
    description: The version of the resource
    type: string
  versionInPath:
    description: Whether to prepend to all paths version to the path, e.g. /v1.0
    type: boolean
  metadata:
    type: object
    properties:
      name:
        description: The name of the resource
        type: string
      description:
        description: The description of the resource
        type: string
  asyncapi:
    type: object
    description: Configuration for asyncapi generation
    properties:
      servers:
        description: A dictionary of servers by environment
        type: object
      channels:
        description: A dictionary of channels
        type: object
    additionalProperties: false
  default_query_params:
    type: array
    description: A list dictionaries
  descriptions:
    type: object
    description: A dictionary of resource type, their HTTP methods and their descriptions
  methods:
    type: object
    description: A dictionary of resource type and their HTTP methods
    properties:
      resource: &http_methods
        description: A list of methods to expose, else all for this level of resource exposure
        type: array
        items:
          type: string
          enum:
            - delete
            - get
            - head
            - options
            - patch
            - post
            - put
      instance: *http_methods
      instance_attrs: *http_methods
  security:
    type: object
    description: A dictionary of resource type, their HTTP methods, and authentication method
    properties:
      scheme:
        type: object
        patternProperties:
          ^.*$:
            type: object
            properties:
              type:
                type: string
                enum:
                  - apiKey
                  - http
                  - oauth2
                  - openIdConnect
              scheme:
                type: string
                enum:
                  - basic
                  - bearer
        additionalProperties: false
      resource: *http_methods
      instance: *http_methods
      instance_attrs: *http_methods
      additionalProperties: false
  validations:
    type: object
    description: >
      Optional, declarative validation rules for this resource, evaluated server
      side by the generated validation package. Resources that omit this key are
      completely unaffected.
    properties:
      rules:
        description: A list of rules, each a CEL expression over the lookups it declares
        type: array
        items:
          type: object
          properties:
            name:
              description: A unique name for this rule, within this resource
              type: string
            description:
              description: What this rule enforces, and why
              type: string
            methods:
              description: The HTTP methods this rule runs on, all mutating methods by default
              type: array
              items:
                type: string
                enum:
                  - delete
                  - patch
                  - post
                  - put
            refs:
              description: >
                The resources this rule needs, keyed by the name it refers to them
                by in the expression. Each entry needs a 'kind' and a 'value', the
                dotted path in the request body holding the value to look up.
              type: object
              patternProperties:
                ^[a-zA-Z_][a-zA-Z0-9_]*$:
                  type: object
                  properties:
                    kind:
                      description: The kind of resource to look up
                      type: string
                    key:
                      description: >
                        The attribute of that resource to match on, its schema key
                        by default
                      type: string
                    value:
                      description: The dotted path in the request body holding the value
                      type: string
                    optional:
                      description: >
                        Whether the rule still runs when this lookup finds nothing.
                        False by default, meaning the rule fails if the resource is
                        missing. Set true for a rule that is about absence, and guard
                        the expression with has().
                      type: boolean
                  required:
                    - kind
                    - value
                  additionalProperties: false
              additionalProperties: false
            expr:
              description: A CEL expression over self, old, refs and ctx, which must be true
              type: string
            error:
              description: The response to give when this rule fails
              type: object
              properties:
                status:
                  description: The HTTP status code, 422 by default
                  type: integer
                message:
                  description: >
                    The message, which may interpolate values with {self.city} style
                    placeholders
                  type: string
              additionalProperties: false
            examples:
              description: Cases this rule must accept or reject, used to generate tests
              type: array
              items:
                type: object
                properties:
                  self:
                    description: The request body
                    type: object
                  old:
                    description: The resource as it currently stands
                    type: object
                  refs:
                    description: The resources the resolver would find, keyed by ref name
                    type: object
                  ctx:
                    description: Anything else the rule needs, e.g. the caller's roles
                    type: object
                  expect:
                    description: Whether this rule should accept or reject the case
                    type: string
                    enum:
                      - pass
                      - fail
                required:
                  - expect
                additionalProperties: false
          required:
            - name
            - expr
          additionalProperties: false
    required:
      - rules
    additionalProperties: false
  client_pkg:
    description: >
      The Rust client crate generated for this resource (e.g. my_project_client).
      Overrides the global --client-pkg for this resource only, enabling multiple
      client crates to coexist in a single generated CLI binary.
    type: string
  namespace:
    description: >
      Optional prefix added to the generated module name to avoid collisions
      when two projects share a resource kind (e.g. namespace: project_a +
      kind: users → module name: project_a_users).
    type: string
  model_pkg_overrides:
    description: >
      Map from $ref filename stem to the Rust client crate that owns the model.
      The key is the schema filename without extension and is matched
      case-insensitively (e.g. "person.yaml" is matched by key "person" or
      "Person"). Only needed when a resource body references models from a
      different OpenAPI source than its own client_pkg (cross-crate $ref).
      Example: { person: shared_models_client }
    type: object
    additionalProperties:
      type: string
  singular:
    description: >
      Explicit singular form of the resource kind, used when deriving model
      type names (e.g. CreateAddress).  Only needed when the automatic
      singularization produces the wrong result.
    type: string
  plural:
    description: >
      Explicit plural form of the resource kind, used for URL paths
      (e.g. plural: proxies when kind: proxy).  Only needed when the
      kind value is not already the plural form.
    type: string
  schema:
    description: The schema of the resource
    type: object
    properties:
      key:
        description: The unique identifier for the resource
        type: object
      query_params:
        description: Query params to be added to select HTTP methods
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            schema:
              type: object
            methods: *http_methods
      descriptions:
        description: An overrideble dictionary of descriptions, per HTTP method, for the resource
        type: object
        properties:
          get:
            type: string
          head:
            type: string
          patch:
            type: string
          post:
            type: string
      items:
        type: object
        properties:
          descriptions:
            description: An overrideble dictionary of descriptions, per HTTP method, for a resource instance
            type: object
            properties:
              get:
                type: string
              head:
                type: string
              patch:
                type: string
              post:
                type: string
          properties:
            description: A list of properties this resource has
            type: object
          additionalProperties: true
        required:
          - properties
        additionalProperties: true
    required:
      - key
      - items
    additionalProperties: true
required:
  - kind
  - apiVersion
  - schema
additionalProperties: false
