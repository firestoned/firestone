# The same rules as examples/addressbook/addressbook/validation, generated for rust.
#
# Both packages come from one `firestone generate validations` run over the same
# resource files, so a rule means the same thing whichever one enforces it.
[package]
name = "addressbook_validation"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cel-interpreter = { version = "0.10", optional = true }

[features]
default = ["cel"]
# Only rules carrying a CEL expression need this; a project using nothing but
# `references` can build with --no-default-features.
cel = ["dep:cel-interpreter"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
