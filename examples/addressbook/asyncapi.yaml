asyncapi: 2.5.0
defaultContentType: application/json
info:
  title: "Example person and addressbook API"
  description: "An example API with more than one resource"
  version: '1.0'
servers:
  dev:
    description: The development websocket server
    protocol: ws
    url: ws://localhost
components:
  schemas:
    addressbook:
      properties:
        address_key:
          description: A unique identifier for an addressbook entry.
          expose: false
          schema:
            type: string
        addrtype:
          description: The address type, e.g. work or home
          enum:
          - work
          - home
          type: string
        city:
          description: The city of this address
          type: string
        country:
          description: The country of this address
          type: string
        is_valid:
          description: Address is valid or not
          type: boolean
        people:
          description: A list of people's names living there
          items:
            type: string
          type: array
        person:
          description: This is a person object that lives at this address.
          schema:
            items:
              properties:
                age:
                  description: The person's age
                  type: integer
                first_name:
                  description: The person's first name
                  type: string
                hobbies:
                  description: The person's hobbies
                  items:
                    type: string
                  type: array
                last_name:
                  description: The person's last name
                  type: string
                timezone:
                  default: UTC
                  description: The person's timezone (e.g. UTC, America/New_York)
                  type: string
                uuid:
                  description: A UUID associated to this person
                  expose: false
                  schema:
                    type: string
              type: object
            key:
              description: A UUID associated to this person
              name: uuid
              schema:
                type: string
            query_params:
            - description: Filter by last name
              methods:
              - get
              name: last_name
              schema:
                type: string
            type: array
        state:
          description: The state of this address
          type: string
        street:
          description: The street and civic number of this address
          type: string
      required:
      - addrtype
      - street
      - city
      - state
      - country
      type: object
    person:
      properties:
        age:
          description: The person's age
          type: integer
        first_name:
          description: The person's first name
          type: string
        hobbies:
          description: The person's hobbies
          items:
            type: string
          type: array
        last_name:
          description: The person's last name
          type: string
        timezone:
          default: UTC
          description: The person's timezone (e.g. UTC, America/New_York)
          type: string
        uuid:
          description: A UUID associated to this person
          expose: false
          schema:
            type: string
      type: object
    persons:
      properties:
        age:
          description: The person's age
          type: integer
        first_name:
          description: The person's first name
          type: string
        hobbies:
          description: The person's hobbies
          items:
            type: string
          type: array
        last_name:
          description: The person's last name
          type: string
        timezone:
          default: UTC
          description: The person's timezone (e.g. UTC, America/New_York)
          type: string
        uuid:
          description: A UUID associated to this person
          expose: false
          schema:
            type: string
      type: object
    postal_codes:
      properties:
        name:
          description: The postal code's name/id
          type: string
        uuid:
          description: A UUID associated to this postal code
          expose: false
          schema:
            type: string
      type: object
channels:
  /addressbook:
    description: Channel for /addressbook
    parameters: {}
    publish:
      bindings:
        ws:
          method: post
          query:
            properties:
              city:
                description: Filter by city name
                type: string
              limit:
                description: Limit the number of responses back
                type: integer
              offset:
                description: The offset to start returning resources
                type: integer
            required: []
            type: object
      description: Publish to /addressbook
      message:
        contentType: application/json
        name: addressbook
        payload:
          $ref: '#/components/schemas/addressbook'
      operationId: addressbook_publish
      tags:
      - name: addressbook
    subscribe:
      bindings:
        ws:
          method: get
          query:
            properties:
