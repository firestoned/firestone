[tool.poetry]
name = "firestoned"
version = "0.8.0"
description = "Build OpenAPI and AsyncAPI specs based off one or more resource json schema files"
authors = ["Erick Bourgeois <erick@jeb.ca>"]
license = "Apache 2.0"
readme = "README.md"
repository = "https://github.com/firestoned/firestone"
packages = [
    { include = "firestone" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
click = ">=8.1.3"
quart = {version = "^0.18.3", optional = true }
Jinja2 = ">=3.1.2"
jsonschema = ">=4.16.0"
pyyaml = ">=6.0"
jsonref = ">=1.0.0.post1"
firestone-lib = ">=0.1.0"
pydantic = ">=1.10.5"
python-dateutil = ">=2.8.2"
aiohttp = ">=3.8.4"
diff-match-patch = ">=20230430"
# Only needed to evaluate the CEL expressions in generated validation rules;
# firestone itself never imports it. Install with: pip install firestoned[validations]
cel-python = { version = ">=0.1.5", optional = true }

[tool.poetry.group.asyncapi.dependencies]
asyncapi = {extras = ["http"], version = ">=0.14.1"}
requests = ">=2.28.1"
websockets = ">=10.4"
typer = ">=0.7.0"
uvicorn = ">=0.19.0"
apidaora = ">=0.28.0"
markdown = ">=3.4.1"

[tool.poetry.group.dev.dependencies] # New dev group
pydoc-markdown = "^4.8.2" # Replaced pdoc with pydoc-markdown for Markdown output

[tool.poetry.group.build.dependencies]
black = ">=22.10.0"
pytest = ">=7.2.0"
pylint = ">=2.15.5"
pytest-mock = ">=3.10.0"
mock = ">=4.0.3"
pycodestyle = ">=2.9.1"
pytest-cov = ">=4.0.0"
swagger-ui-py = ">=22.7.13"
aiohttp-retry = "^2.8.3"
#firestone-lib = { path = "../firestone-lib/", develop = true }
toml = "^0.10.2"
# Also declared as the optional "validations" extra, for consumers. Kept here so a
# plain 'poetry install' can run the tests that evaluate CEL rules.
cel-python = ">=0.1.5"


[tool.poetry.group.fastapi.dependencies]
fastapi = "^0.115.11"


[tool.poetry.group.webui.dependencies]
streamlit = "^1.44.1"
dictdiffer = "^0.9.0"

[tool.poetry.extras]
caching = ["quart", "asyncapi", "requests", "websockets", "typer", "uvicorn", "apidaora"]
validations = ["cel-python"]

[tool.poetry.scripts]
firestone = 'firestone.__main__:main'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# The generated validation package under examples/ carries its own generated tests,
# which are meant to run inside the project firestone generated them into.
[tool.pytest.ini_options]
testpaths = ["test"]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 150
good-names = [
    "fh",
    "op"
]
max-args = 8
max-positional-argument = 10
disable = """
    logging-fstring-interpolation,
    fixme
"""
